# MPSim (Material Property Simulation) - conda environment
#
# NASA PuMA is only distributed on conda-forge (package "puma"); the PyPI
# package called "pumapy" is an unrelated project. The versions below are the
# ones the self-test was run with on Windows 11 (win-64).
#
#   conda env create -p .\env -f environment.yml
#
name: mpsim
channels:
  - conda-forge
dependencies:
  - python=3.11
  - puma=3.2.2
  - numpy=1.26
  - scipy=1.11
  - numba
  - scikit-image
  # vtk and pyvista must be pinned together with PuMA. PuMA only asks for
  # "pyvista >=0.40" and "vtk", and with those open the solver picks vtk 9.7,
  # where vtkCapsuleSource is gone; pyvista then fails to import and PuMA with
  # it ("cannot import name 'vtkCapsuleSource'"). These two versions are the
  # ones the self-test was run with.
  - vtk=9.5.2
  - pyvista=0.47.1
  - matplotlib
  - tifffile
  - flask
  - scikit-learn=1.9
  - psutil
  - pip
  - pip:
      - porespy==3.0.4
      - scikit-rf==1.3.0
      - pyamg==5.1.0
